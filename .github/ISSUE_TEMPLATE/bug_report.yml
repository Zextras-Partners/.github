name: Bug Report
description: Report a problem with a script, playbook, integration, or automation tool.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before opening this issue, please check whether the same problem has already been reported.

        **Do not include** passwords, tokens, private keys, certificates, customer information,
        production data, internal hostnames/IPs, private URLs, or any other confidential
        information. Sanitize all logs, configs, inventories, screenshots, and command output
        before submitting.

        If this is a **security vulnerability**, do not report it here — see the repository's
        security policy for a private disclosure process instead.

  - type: input
    id: carbonio-version
    attributes:
      label: Carbonio version
      description: The Carbonio version where the issue occurs.
      placeholder: e.g. Carbonio CE 24.x
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system and version
      placeholder: e.g. Ubuntu 22.04, RHEL 9
    validations:
      required: true

  - type: input
    id: tool-versions
    attributes:
      label: Relevant tool or dependency versions
      description: Ansible, Python, Docker, etc. — whatever is relevant to this repository.
      placeholder: e.g. ansible-core 2.16, python 3.11
    validations:
      required: false

  - type: textarea
    id: command
    attributes:
      label: Command used to run the script or playbook
      render: shell
    validations:
      required: true

  - type: textarea
    id: config-env
    attributes:
      label: Relevant configuration or environment details
      description: Sanitize before submitting — no secrets, hostnames, IPs, or production data.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example possible.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and error messages
      description: Sanitized. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: input
    id: frequency
    attributes:
      label: How often does the problem occur?
      placeholder: e.g. always, intermittently (~1 in 10 runs), only under load
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have checked for existing issues covering the same problem.
          required: true
        - label: I have sanitized all logs, configuration, and output included above.
          required: true
        - label: This is not a security vulnerability report.
          required: true
